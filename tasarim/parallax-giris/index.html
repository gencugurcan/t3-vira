<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vira — Parallax Giriş Prototipi</title>

  <!--
    Bağımsız statik prototip. src/app/ ve Next.js route sistemiyle hiçbir ilişkisi yok.
    Bu dosyayı doğrudan tarayıcıda açarak (çift tıklayarak) test edebilirsiniz.
  -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ==========================================================
       PARALLAX BÖLÜMLERİ (1-4)
       Her .section tam ekran (100vh), içinde relative konumlu
       .bg katmanı arka plan görselini taşır ve GSAP ScrollTrigger
       ile scroll'a bağlı olarak hareket eder.
       ========================================================== -->

  <section class="section" data-section="1">
    <div class="bg bg-1" aria-hidden="true"></div>
    <div class="section-icerik">
      <h1>Başlık 1</h1>
    </div>
  </section>

  <section class="section" data-section="2">
    <div class="bg bg-2" aria-hidden="true"></div>
    <div class="section-icerik">
      <h1>Başlık 2</h1>
    </div>
  </section>

  <section class="section" data-section="3">
    <div class="bg bg-3" aria-hidden="true"></div>
    <div class="section-icerik">
      <h1>Başlık 3</h1>
    </div>
  </section>

  <section class="section" data-section="4">
    <div class="bg bg-4" aria-hidden="true"></div>
    <div class="section-icerik">
      <h1>Başlık 4</h1>
    </div>
  </section>


  <!-- ==========================================================
       LOGIN BÖLÜMÜ (5. ve son bölüm)
       Ayrı, net bir blok halinde: kolayca bulunup düzenlenebilsin
       diye parallax bölümlerinden yapısal olarak ayrıldı.
       Bilerek ".section" sınıfını KULLANMIYOR, bu sayede
       script.js'teki gsap.utils.toArray(".section") sorgusuna
       dahil olmuyor ve parallax animasyonu almıyor (sadece
       sabit bir arka plan görseli var).
       ========================================================== -->

  <section class="login-bolumu" data-section="login">
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-overlay" aria-hidden="true"></div>

    <div class="login-kart">
      <!-- Logo/başlık yeri — gerçek logo eklenene kadar placeholder -->
      <div class="login-logo-yeri">
        <span class="login-logo-placeholder">VIRA</span>
        <p class="login-alt-baslik">Girişim ekosistemi yönetim sistemi</p>
      </div>

      <!--
        Form şimdilik tamamen görsel/statik. submit script.js içinde
        preventDefault ile engelleniyor. İleride gerçek login akışına
        (Supabase auth) bağlanacak — bkz. script.js içindeki TODO yorumu.
      -->
      <form id="giris-form" class="login-form" novalidate>
        <div class="form-alani">
          <label for="eposta">E-posta</label>
          <input
            type="email"
            id="eposta"
            name="eposta"
            placeholder="ornek@t3vira.app"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-alani">
          <label for="sifre">Şifre</label>
          <input
            type="password"
            id="sifre"
            name="sifre"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="giris-butonu">Giriş Yap</button>

        <!--
          "Şifremi unuttum" SADECE görsel — kasıtlı olarak <a href="..."> değil,
          <button type="button"> kullanıldı ki hem tıklanabilir/odaklanabilir
          olsun hem de href="#" ile sayfanın en üstüne zıplama gibi istenmeyen
          bir yan etki oluşmasın. Herhangi bir click handler'a BAĞLI DEĞİL —
          backend'de şifre sıfırlama akışı olmadığı için bilerek işlevsiz.
        -->
        <button type="button" class="sifremi-unuttum">Şifremi unuttum</button>
      </form>
    </div>
  </section>


  <!-- GSAP + ScrollTrigger — sürüm sabitlendi (3.12), "latest" DEĞİL -->
  <script src="https://unpkg.com/gsap@3.12/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12/dist/ScrollTrigger.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
